# Finishes the server side of SAGEC from GitHub, so nothing has to be typed on the VPS.
# Run by hand: Actions → "Server setup" → Run workflow. Safe to run again (nothing is added twice).
#  - "Change the database password" ticked: first put a new password in the DATABASE_URL secret; this logs in
#    with the old one (from the VPS .env) and switches the database to the new one
#  - always: writes the database address from the DATABASE_URL secret into /var/www/sagec/.env (the deploy
#    already uses that secret, so the site and the deploy can never disagree), restarts the site and checks
#    that it reads the database
#  - always: installs the nightly database backup (02:17 every night, 14 days kept) and makes one backup now
#  - "Go live" ticked: adds sagecltd.com + www to Caddy (HTTPS), checks the file, reloads Caddy. The other
#    sites keep running; if the check fails the old Caddy file is put back. Tick it right before pointing the
#    domain at the VPS in Cloudflare (web/docs/DEPLOY.md step 9).
name: Server setup

on:
  workflow_dispatch:
    inputs:
      change_db_password:
        description: 'Change the database password to the one now in the DATABASE_URL secret (update the secret first)'
        type: boolean
        default: false
      go_live:
        description: 'Go live: add sagecltd.com to Caddy (then switch the DNS in Cloudflare)'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Check the database address
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node web/deploy/check-db-url.mjs

      - name: Change the database password
        if: inputs.change_db_password
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_deploy web/deploy/change-db-password.sh "$VPS_USER@$VPS_HOST:/var/www/sagec/change-db-password.sh"
          # The new password goes through stdin: never in a command line or the log.
          node -e 'process.stdout.write(decodeURIComponent(new URL(process.env.DATABASE_URL).password))' \
            | ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" 'bash /var/www/sagec/change-db-password.sh'

      - name: Database address in the site's settings file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # The new line goes through stdin, so the password never appears in a command line or the log.
          printf 'DATABASE_URL="%s"\n' "$DATABASE_URL" | ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" 'set -e
            F=/var/www/sagec/.env
            NEW=$(cat)
            [ -f "$F" ] || { echo "::error::$F does not exist (DEPLOY.md step 2)"; exit 1; }
            if grep -qxF "$NEW" "$F"; then
              echo "The database address in .env is already right."
            else
              umask 077
              cp "$F" "$F.bak"
              { printf "%s\n" "$NEW"; grep -v "^DATABASE_URL=" "$F.bak"; } > "$F.new"
              mv "$F.new" "$F"
              chmod 600 "$F" "$F.bak"
              echo "Database address updated in .env (previous file kept as .env.bak)."
              pm2 restart sagec --update-env > /dev/null
            fi
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://127.0.0.1:3022/api/globals/company-info; then echo "The site reads the database."; exit 0; fi
              sleep 1
            done
            pm2 logs sagec --lines 30 --nostream
            echo "::error title=Database::The site cannot read the database. If you changed the sagec password on the VPS, put the new one in the DATABASE_URL secret and run this again."
            exit 1'

      - name: Nightly backup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_deploy web/deploy/backup-sagec.sh "$VPS_USER@$VPS_HOST:/var/www/sagec/backup-sagec.sh"
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" 'set -e
            chmod 700 /var/www/sagec/backup-sagec.sh
            command -v pg_dump >/dev/null || { echo "::error::pg_dump is not installed on the VPS"; exit 1; }
            LINE="17 2 * * * /var/www/sagec/backup-sagec.sh >> /var/www/sagec/backup.log 2>&1"
            if crontab -l 2>/dev/null | grep -qF "/var/www/sagec/backup-sagec.sh"; then
              echo "Nightly backup already scheduled."
            else
              (crontab -l 2>/dev/null; echo "$LINE") | crontab -
              echo "Nightly backup scheduled for 02:17."
            fi
            /var/www/sagec/backup-sagec.sh
            ls -lh /var/www/sagec/backups | tail -n 3'

      - name: Go live in Caddy
        if: inputs.go_live
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_deploy web/deploy/Caddyfile.sagec "$VPS_USER@$VPS_HOST:/var/www/sagec/Caddyfile.sagec"
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" 'set -e
            if ! sudo -n true 2>/dev/null; then
              echo "::error title=Needs sudo::This login cannot use sudo without a password, so Caddy cannot be changed from GitHub. Run on the VPS: sudo bash -c \"cat /var/www/sagec/Caddyfile.sagec >> /etc/caddy/Caddyfile\" && sudo systemctl reload caddy"
              exit 1
            fi
            CF=/etc/caddy/Caddyfile
            if sudo grep -qE "^sagecltd\.com[[:space:]]*\{" "$CF"; then
              echo "sagecltd.com is already in Caddy."
            else
              BACKUP="$CF.before-sagec-$(date +%Y%m%d%H%M%S)"
              sudo cp "$CF" "$BACKUP"
              printf "\n" | sudo tee -a "$CF" >/dev/null
              sudo tee -a "$CF" < /var/www/sagec/Caddyfile.sagec >/dev/null
              if ! sudo caddy validate --config "$CF" --adapter caddyfile; then
                sudo cp "$BACKUP" "$CF"
                echo "::error::The Caddy check failed; the previous Caddyfile was put back. Nothing changed for the other sites."
                exit 1
              fi
              sudo systemctl reload caddy
              echo "Caddy reloaded with sagecltd.com (copy of the previous file: $BACKUP)."
            fi'
          echo "::notice title=Next::Now point sagecltd.com at the VPS in Cloudflare (web/docs/DEPLOY.md step 9). HTTPS starts within a minute."
