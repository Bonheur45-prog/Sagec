# Copies the content of the old Payload CMS into the new one (web/scripts/import-payload.ts).
# Run by hand: Actions → "Import from the old CMS" → Run workflow. First with "check only" ticked
# (changes nothing, lists what would be copied), then without. Safe to run again: nothing is duplicated.
# Needs, besides the deploy secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET,
# and optionally PAYLOAD_EMAIL + PAYLOAD_PASSWORD (an admin login of the old CMS, for contact messages,
# unapproved comments and closed job openings).
name: Import from the old CMS

on:
  workflow_dispatch:
    inputs:
      payload_url:
        description: 'Address of the old CMS (where you log in, without /admin), e.g. https://cms.example.com'
        required: true
        type: string
      check_only:
        description: 'Check only (change nothing)'
        type: boolean
        default: true
      overwrite_pages:
        description: 'Overwrite page texts already edited in the new CMS'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_HOSTNAME: ${{ secrets.R2_PUBLIC_HOSTNAME }}
      PAYLOAD_URL: ${{ inputs.payload_url }}
      PAYLOAD_EMAIL: ${{ secrets.PAYLOAD_EMAIL }}
      PAYLOAD_PASSWORD: ${{ secrets.PAYLOAD_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci

      - name: Check the database address
        run: node deploy/check-db-url.mjs
      - name: Install ffprobe (video sizes)
        run: sudo apt-get install -y -qq ffmpeg > /dev/null || true
      - name: Open a tunnel to the database on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          read -r DB_HOST DB_PORT <<< "$(node -e 'const u = new URL(process.env.DATABASE_URL); console.log(u.hostname.replace(/^\[|\]$/g, ""), u.port || 5432)')"
          case "$DB_HOST" in localhost|127.0.0.1|::1|"$VPS_HOST") ;; *) exit 0 ;; esac
          ssh -i ~/.ssh/id_deploy -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -f -N -L "15432:127.0.0.1:$DB_PORT" "$VPS_USER@$VPS_HOST"
          TUNNELED=$(node -e 'const u = new URL(process.env.DATABASE_URL); u.hostname = "127.0.0.1"; u.port = "15432"; console.log(u.toString())')
          echo "::add-mask::$TUNNELED"
          echo "DATABASE_URL=$TUNNELED" >> "$GITHUB_ENV"
      - name: Import
        run: |
          args=""
          [ "${{ inputs.check_only }}" = "true" ] && args="$args --check"
          [ "${{ inputs.overwrite_pages }}" = "true" ] && args="$args --pages"
          npm run import:payload -- $args
